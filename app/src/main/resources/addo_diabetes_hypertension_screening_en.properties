step1_title = Client consent
step1_consent_message = We are here today to conduct a health screening for high blood pressure and diabetes. This screening is free, does not involve blood or injections, and is aimed at early detection of preventable health problems.
step1_agree_with_screening_procedure_hint = Do you agree with proceedings?
step1_agree_with_screening_procedure_hint_err = Please select whether you agree with the screening
step1_reasons_for_declining_label = Reasons for declining
step1_reasons_for_declining_key_not_well =Not feeling well or not ready
step1_reasons_for_declining_key_in_hurry =They are in a hurry
step1_reasons_for_declining_key_need_permission =Need to consult someone first before screening (permission from spouse/relative)
step1_reasons_for_declining_key_privacy_trust =Privacy and trust issues (fear of misuse of personal health information)
step1_reasons_for_declining_key_lack_trust_chw =Lack of trust in CHW (uncomfortable with CHW or opposite sex)
step1_reasons_for_declining_key_feel_healthy =Don't feel the need (feel healthy and no need for screening)
step1_reasons_for_declining_key_confusion_process =Confusion about the screening process (fear of pain, unfamiliar procedures)
step1_reasons_for_declining_key_fear_anxiety =Fear and anxiety (worry about diagnosis or consequences)
step1_reasons_for_declining_key_fear_referral =Fear of referral or hospitalization
step1_reasons_for_declining_key_religious_reasons =Religious reasons (strong belief against medical intervention)
step1_reasons_for_declining_key_fear_technology =Discomfort or fear of technology
step1_reasons_for_declining_options_err =Please provide the reason(s) for declining

