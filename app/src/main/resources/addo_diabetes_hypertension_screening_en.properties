step3_title = Diabetes and Hypertension Screening
step3_family_history_diabetes_hint = Family history of diabetes?
step3_family_history_diabetes_hint_err = Please select whether there is a family history of diabetes
step3_family_history_diabetes_info_title = About family history of diabetes
step3_family_history_diabetes_info_text = What it means: Whether any of the client's first-degree blood relatives has been diagnosed with diabetes.\n\nFirst-degree blood relatives: biological parents, biological brothers and sisters (full siblings), and biological children.\n\nWhy it matters: Family history raises the client's own risk through shared genetics and often shared diet and lifestyle. The risk is higher when more than one close relative is affected, or when relatives were diagnosed at a younger age.\n\nDoes NOT count: aunts, uncles, cousins, grandparents, in-laws, or step-relatives.\n\nIf unsure: ask the client to confirm with their family before answering. If they remain uncertain, answer No.
step3_waist_circumference_hint = Waist Circumference (cm)
step3_waist_circumference_numeric_err = Please enter the waist circumference
step3_waist_circumference_30_err = This waist circumference is very small, waist circumference can not be lower than 30
step3_waist_circumference_300_err = The waist circumference can not be greater than 300
step3_waist_circumference_hint_err = Please enter the waist circumference
step3_systolic_bp_hint = Systolic blood pressure (mmHg)
step3_systolic_bp_info_title = About the top number (systolic)
step3_systolic_bp_info_text = What it is: The TOP number when you measure blood pressure. It shows how hard the blood pushes when the heart is beating.\n\nNormal: less than 120.\nA bit high: 120 to 139 - talk to the client about healthy habits (less salt, more exercise, less alcohol, no smoking) and check again next visit.\nHigh: 140 or more.\n\nHow to measure well:\n- Let the client sit quietly for at least 5 minutes before you start.\n- Feet on the floor, back resting on the chair, arm resting on a table at the same level as the heart.\n- The cuff should fit the arm - not too tight, not too loose. Place it on bare skin.\n- The client should not have smoked, drunk coffee or tea, or done exercise in the last 30 minutes.\n- Take TWO readings, 1-2 minutes apart, and use the average. If the two readings are very different (more than 10 apart), take a third reading.\n\nWrite down the number exactly as you see it on the machine.
step3_systolic_bp_numeric_err = Please enter the systolic value
step3_systolic_bp_50_err = Systolic value must be equal or greater than 50
step3_systolic_bp_320_err = Systolic value must be equal or less than 320
step3_systolic_bp_hint_err = Please enter the systolic value
step3_diastolic_bp_hint = Diastolic blood pressure (mmHg)
step3_diastolic_bp_info_title = About the bottom number (diastolic)
step3_diastolic_bp_info_text = What it is: The BOTTOM number when you measure blood pressure. It shows the pressure when the heart is resting between beats.\n\nNormal: less than 80.\nA bit high: 80 to 89 - talk to the client about healthy habits and check again next visit.\nHigh: 90 or more.\n\nImportant: The bottom number must always be smaller than the top number. If the bottom number is the same as or bigger than the top number, check that the cuff is on the right way and measure again.\n\nUse the same steps as for the top number: client sits quietly for 5 minutes, arm at heart level, the right cuff on bare skin, no smoking or coffee or exercise in the last 30 minutes.
step3_diastolic_bp_numeric_err = Please enter the diastolic value
step3_diastolic_bp_30_err = Diastolic value must be equal or greater than 30
step3_diastolic_bp_200_err = Diastolic value must be equal or less than 200
step3_diastolic_bp_hint_err = Please enter the diastolic value
step3_diastolic_lt_systolic_err = The diastolic value must be less than the systolic value

