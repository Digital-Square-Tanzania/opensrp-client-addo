step1_agree_with_screening_procedure_hint_err = Tafadhali chagua kama amekubali kufanyiwa uchunguzi
step1_reasons_for_declining_label = Sababu za kukataa kushiriki
step1_reasons_for_declining_key_not_well_not_prepared = Mtu hajisikii vizuri au bado hajajiandaa kwa uchunguzi
step1_reasons_for_declining_key_in_hurry = Hana muda wa kushiriki kwa sasa
step1_reasons_for_declining_key_privacy_trust = Hofu ya taarifa za afya kutumika vibaya, au hofu kwamba programu inarekodi taarifa nyingi sana
step1_reasons_for_declining_key_feel_healthy = Mteja anaona yuko na afya njema na hakuna haja ya kufanyiwa uchunguzi
step1_reasons_for_declining_key_fear_anxiety = Wasiwasi wa kugundulika na ugonjwa
step1_reasons_for_declining_key_other_reason = Nyingine, taja
