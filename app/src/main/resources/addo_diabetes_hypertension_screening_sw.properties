step1_title = Fomu ya ridhaa ya mteja
step1_consent_message = Tupo hapa leo kufanya uchunguzi wa afya kwa shinikizo la juu la damu na kisukari. Uchunguzi huu ni bure, hautumii damu wala sindano, na unalenga kugundua mapema matatizo ya afya yanayoweza kuzuilika.
