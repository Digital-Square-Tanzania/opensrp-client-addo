step3_title = Uchunguzi wa kisukari na shinikizo la damu
step3_family_history_diabetes_hint = Je, kuna historia ya kisukari katika familia yako?
step3_family_history_diabetes_hint_err = Tafadhali chagua moja
step3_family_history_diabetes_info_title = Kuhusu historia ya familia ya kisukari
step3_family_history_diabetes_info_text = Maana yake: Kama kuna ndugu wa karibu wa mteja wa damu aliyewahi kugundulika na ugonjwa wa kisukari.\n\nNdugu wa karibu wa damu: wazazi wa kibaiolojia, kaka na dada wa kuzaliwa wote (siyo wa kambo), na watoto wa kibaiolojia wa mteja.\n\nKwa nini ni muhimu: Historia ya familia huongeza hatari ya mteja kupata kisukari kutokana na vinasaba (jeni) na pia mlo na mtindo wa maisha unaoshirikishwa katika familia. Hatari inakuwa kubwa zaidi pale ambapo ndugu zaidi ya mmoja wamewahi kuugua, au pale waliougua walipogundulika wakiwa na umri mdogo.\n\nWafuatao hawahesabiki: shangazi, mjomba, binamu, babu na bibi, ndugu wa kuoana, au ndugu wa kambo.\n\nKama una mashaka: muulize mteja athibitishe na familia yake kabla ya kujibu. Kama bado kuna mashaka, anaweza kujibu Hapana.
step3_waist_circumference_hint = Mzingo wa kiuno (cm)
step3_waist_circumference_numeric_err = Tafadhali ingiza mzingo wa kiuno kwa sentimita (cm)
step3_waist_circumference_30_err = Namba hii ni ndogo mno kwa mzingo wa kiuno
step3_waist_circumference_300_err = Namba hii ni kubwa mno kwa mzingo wa kiuno
step3_waist_circumference_hint_err = Tafadhali ingiza mzingo wa kiuno
step3_systolic_bp_hint = Shinikizo la damu (Systolic) (mmHg)
step3_systolic_bp_info_title = Kuhusu nambari ya juu (systolic)
step3_systolic_bp_info_text = Maana yake: Ni nambari ya JUU unayoiona unapopima shinikizo la damu. Inaonyesha jinsi damu inavyosukumwa kwa nguvu wakati moyo unapodunda.\n\nKawaida: chini ya 120.\nImepanda kidogo: 120 hadi 139 - ongea na mteja kuhusu tabia za kiafya (kupunguza chumvi, kufanya mazoezi zaidi, kupunguza pombe, kuacha sigara) na uangalie tena ziara ijayo.\nIko juu: 140 au zaidi.\n\nJinsi ya kupima vizuri:\n- Acha mteja akae kimya kwa angalau dakika 5 kabla ya kuanza.\n- Miguu iko sakafuni, mgongo umeegemea kiti, mkono umelala juu ya meza katika kiwango cha moyo.\n- Cuff (mkanda wa kupimia) inapaswa kufaa mkono - siyo ya kubana sana wala ya kulegea. Iweke kwenye ngozi iliyo wazi.\n- Mteja asiwe amevuta sigara, hajakunywa kahawa au chai, na hajafanya mazoezi katika dakika 30 zilizopita.\n- Chukua vipimo VIWILI kwa muda wa dakika 1-2 kati yake, na utumie wastani. Kama vipimo viwili vinatofautiana sana (zaidi ya 10), chukua kipimo cha tatu.\n\nAndika nambari hasa kama unavyoiona kwenye kifaa.
step3_systolic_bp_numeric_err = Tafadhali ingiza nambari
step3_systolic_bp_50_err = Kiwango lazima kiwe sawa au kikubwa kuliko 50
step3_systolic_bp_320_err = Kiwango lazima kiwe sawa au kidogo kuliko 320
step3_systolic_bp_hint_err = Tafadhali ingiza shinikizo la juu la damu
step3_diastolic_bp_hint = Shinikizo la damu (Diastolic) (mmHg)
step3_diastolic_bp_info_title = Kuhusu nambari ya chini (diastolic)
step3_diastolic_bp_info_text = Maana yake: Ni nambari ya CHINI unayoiona unapopima shinikizo la damu. Inaonyesha shinikizo wakati moyo unapopumzika kati ya mapigo.\n\nKawaida: chini ya 80.\nImepanda kidogo: 80 hadi 89 - ongea na mteja kuhusu tabia za kiafya na uangalie tena ziara ijayo.\nIko juu: 90 au zaidi.\n\nMuhimu: Nambari ya chini lazima daima iwe ndogo kuliko nambari ya juu. Kama nambari ya chini ni sawa na au kubwa kuliko ya juu, hakikisha cuff iko vizuri kisha pima tena.\n\nTumia hatua zile zile kama za nambari ya juu: mteja akae kimya kwa dakika 5, mkono katika kiwango cha moyo, cuff sahihi kwenye ngozi iliyo wazi, asiwe amevuta sigara au kunywa kahawa au kufanya mazoezi katika dakika 30 zilizopita.
step3_diastolic_bp_numeric_err = Tafadhali ingiza nambari
step3_diastolic_bp_30_err = Nambari hii ni ndogo mno kwa shinikizo la chini la damu
step3_diastolic_bp_200_err = Nambari hii ni kubwa mno kwa shinikizo la chini la damu
step3_diastolic_bp_hint_err = Tafadhali ingiza shinikizo la chini la damu
step3_diastolic_lt_systolic_err = Shinikizo la damu (diastolic) linatikiwa liwe dogo kuliko shinikizo la damu (systolic)

step_4_title = Fomu ya Rufaa
step4_diabetes_risk_score_output_hint = Matokeo ya tathimini ya hatari ya mgonjwa
step4_risk_present_toaster_text = Uchunguzi wa awali unaonyesha kuwa kuna uwezekano wa kuwa katika hatari ya ugonjwa wa {condition}. Hii haimaanishi kwamba tayari una ugonjwa huo. Hivyo ni vyema kutembelea kituo cha kutolea huduma za afya kwa ajili ya vipimo zaidi.
step4_client_refused_assessment_text = Mteja amekataa kufanyiwa uchunguzi wa kisukari na shinikizo la damu. Tafadhali heshimu uamuzi wa mteja na usifanye uchunguzi bila ridhaa yake.
step4_prescreening_client_has_condition_toaster_text = Kwa mujibu wa taarifa ulizotoa, tayari umegunduliwa, umefanyiwa uchunguzi hivi karibuni, au umejiandikisha katika huduma za kawaida za kisukari au shinikizo la damu. Hivyo basi, huhitaji kufanyiwa uchunguzi mwingine kwa sasa. Tafadhali endelea na ukaguzi wa afya wa mara kwa mara na ufuate ushauri wa mtoa huduma wako wa afya.
step4_no_risk_present_toaster = Kwa sasa hakuna dalili kuwa uko katika hatari ya kuwa na ugonjwa wa kisukari au shinikizo la damu. Tunakuhimiza kuendelea kuishi maisha yenye afya, ikiwemo kula vizuri, kufanya mazoezi, na kwenda kupimwa mara kwa mara.
