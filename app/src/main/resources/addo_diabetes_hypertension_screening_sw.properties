step1_title = Fomu ya ridhaa ya mteja
step1_consent_message = Tupo hapa leo kwa ajili kufanya uchunguzi wa afya wa shinikizo la damu na kisukari. Uchunguzi huu ni wa bure na pia hauusishi kuchoma sindano wala kutoa damu. Unalenga kugundua mapema matatizo ya afya yanayoweza kuzuilika.
