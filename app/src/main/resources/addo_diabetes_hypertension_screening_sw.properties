step1_reasons_for_declining_key_privacy_trust = Hofu ya taarifa za afya kutumika vibaya, au hofu kwamba programu inarekodi taarifa nyingi sana
step1_reasons_for_declining_key_feel_healthy = Mteja anaona yuko na afya njema na hakuna haja ya kufanyiwa uchunguzi
step1_reasons_for_declining_key_fear_anxiety = Wasiwasi wa kugundulika na ugonjwa
