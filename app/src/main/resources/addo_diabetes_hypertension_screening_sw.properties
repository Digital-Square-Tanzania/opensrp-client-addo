step_4_title = Fomu ya Rufaa
step4_diabetes_risk_score_output_hint = Matokeo ya tathimini ya hatari ya mgonjwa
step4_risk_present_toaster_text = Nimegundua kuwa unaweza kuwa katika hatari ya ugonjwa wa {condition}. Hii haimaanishi kwamba tayari una ugonjwa huo. Hivyo ni vyema kutembelea kituo cha kutolea huduma za afya kwa ajili ya vipimo zaidi.
step4_client_refused_assessment_text = Mteja amekataa kufanyiwa uchunguzi wa kisukari na shinikizo la damu. Tafadhali heshimu uamuzi wa mteja na usifanye uchunguzi bila ridhaa yake.
step4_prescreening_client_has_condition_toaster_text = Kwa mujibu wa taarifa ulizotoa, tayari unapokea huduma  na umeshafanyiwa uchunguzi wa kisukari na shinikizo la damu hivi karibuni. Hivyo basi, hauhitaji kufanyiwa uchunguzi mwingine kwa sasa. Tafadhali endelea kuhudhuria kliniki na kufuata ushauri wa mtoa huduma wako wa afya. Ni muhimu kuzingatia matumizi sahihi ya dawa ulizopewa na kudumisha mtindo mzuri wa maisha kama kufanya mazoezi mara kwa mara na kula chakula chenye lishe bora.
step4_prescreening_client_has_condition_toaster_not_using_meds = Umetaja kuwa kwa sasa hutumii dawa za kisukari au shinikizo la damu. Ni muhimu kufika kituo cha afya kilicho karibu nawe kwa ushauri wa kitabibu na matibabu iwapo itahitajika. Huhitaji kufanyiwa uchunguzi mpya kwa sasa, lakini unashauriwa kuendelea na ukaguzi wa afya wa mara kwa mara kama utakavyoelekezwa na mtoa huduma wako wa afya.
step4_no_risk_present_toaster = Kwa sasa hakuna dalili kuwa uko katika hatari ya kuwa na ugonjwa wa kisukari au shinikizo la damu. Tunakuhimiza kuendelea kuishi maisha yenye afya, ikiwemo kula vizuri, kufanya mazoezi, na kwenda kupimwa mara kwa mara.
step4_service_before_referral = Huduma zilizotolewa kabla ya rufaa
